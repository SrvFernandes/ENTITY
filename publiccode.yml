description:
  en:
    localisedName: ENTITY
    shortDescription: >
      Open protocol for sovereign digital authority, provenance, data rights,
      recovery and governed data state.
    longDescription: >
      ENTITY is an Apache-2.0 open-source protocol and reference implementation
      for persistent digital identity, delegated authority, provenance and
      evidence, explicit rights, portable recovery and interoperable economic
      state. ENTITY v3.4.2 also introduces the Blackmore Technology Data
      Universe (BTDU), a governed information topology built from reusable atoms,
      bonds and compounds while preserving separate authority, provenance,
      rights and economic boundaries. The protocol does not require a native
      token, mining or staking. Current public qualification material explicitly
      distinguishes Blackmore Technology Group-controlled evidence from unrelated
      external validation.
    documentation: "https://blackmore-technology-group.github.io/ENTITY-DOCS/"
    apiDocumentation: "https://blackmore-technology-group.github.io/ENTITY-DOCS/developer/"
    features:
      - Persistent sovereign digital identity and delegated authority
      - Explicit provenance, evidence and claim-state boundaries
      - Governed data rights and entitlement state
      - Portable export, backup and recovery semantics
      - Global Passport and cross-domain profile architecture
      - Blackmore Technology Data Universe governed topology
      - Public conformance, reproduction and external qualification challenges
